[project]
name = "DeSiMaTe"
version = "0.1.1"
description = "DeSiMaTe: Detect Similar Markdown Text"
readme = "README.md"
authors = [
    { name = "Guillaume Cardoen", email = "Guillaume.CARDOEN@umons.ac.be" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "duckdb>=1.5.6",
    "hdbscan>=0.8.44",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "scipy-stubs~=1.18.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "unidecode>=1.4.0",
    "wenmode>=0.15.1",
]

[project.scripts]
desimate = "desimate:main.cli"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
