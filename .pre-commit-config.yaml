repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.9
  hooks:
    # Run the linter.
    - id: ruff-check
      args:
        - --per-file-ignores=__init__.py:F401
        - --ignore=F841
        - --ignore=F405
        - --ignore=F403
        - --ignore=E741
        - --fix
    # Run the formatter.
    - id: ruff-format
